<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectManager - Salesforce Development</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Boxicons for icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation (Optional/Minimal) -->
        <aside class="sidebar">
            <div class="brand">
                <i class='bx bx-code-block'></i>
                <span>Projects</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" id="nav-dashboard">
                    <i class='bx bx-grid-alt'></i> Dashboard
                </a>
                <a href="#" class="nav-item" id="nav-cli">
                    <i class='bx bx-terminal'></i> CLI Actions
                </a>
                <a href="#" class="nav-item" id="nav-git">
                    <i class='bx bx-git-branch'></i> Git Actions
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="topbar">
                <h1 id="page-title">Dashboard</h1>
                <div class="topbar-actions">
                    <button class="btn btn-primary" id="btn-new-project">
                        <i class='bx bx-plus'></i> New Project
                    </button>
                </div>
            </header>

            <div class="content-area" id="app-content">
                <!-- Content injected by JS -->
            </div>
        </main>
    </div>

    <!-- Global Modal Overlay -->
    <div class="modal-overlay" id="global-modal">
        <div class="modal-content glass-panel" id="modal-container">
            <!-- Modal content injected here -->
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/components/modal.js"></script>
    <script src="/js/components/dashboard.js"></script>
    <script src="/js/components/projectDetail.js"></script>
    <script src="/js/components/cliActions.js"></script>
    <script src="/js/components/gitActions.js"></script>
    <script src="/js/app.js"></script>
</body>

</html>
